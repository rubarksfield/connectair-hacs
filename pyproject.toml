[project]
name = "ha-connectair"
version = "0.1.0"
requires-python = ">=3.14.2"
dependencies = ["aiohttp>=3.11", "voluptuous>=0.15"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "aioresponses>=0.7",
    "ruff>=0.12",
    "homeassistant==2026.9.2",
    "pytest-homeassistant-custom-component>=0.13.365",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
