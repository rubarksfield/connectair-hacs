name: Report a bug
description: Help us clear the air when something breaks.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Connectair. Please keep passwords, tokens, sign-in callback addresses, account/device IDs, household IP/MAC addresses and raw captures out of this issue.
  - type: input
    id: integration_version
    attributes:
      label: Connectair integration version
      placeholder: "e.g. 0.1.3"
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2026.9.2"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Ventilation model
      description: The model name only; no serial numbers, device IDs or registration keys.
      placeholder: "e.g. S&P NARAH 160 RT"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the result you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A short sequence that another user could follow.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Redacted error messages
      description: Optional short error excerpts. Remove private details before pasting; do not attach raw cloud responses, login addresses or captures.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I have removed credentials, sign-in addresses and account, device and household identifiers.
          required: true
